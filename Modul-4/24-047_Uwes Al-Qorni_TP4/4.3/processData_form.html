<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

<h2>Register</h2>

<form action="prosesData2.php" method="GET">

    <fieldset>
        <legend>Person Details</legend>

        <label>Surname</label><br>
        <input type="text" name="surname" size="31" required>
        <br><br>

        <label>Email address</label><br>
        <input type="email" name="email" size="31" required>
        <br><br>

        <label>Password</label><br>
        <input type="password" name="password" size="31" required>
        <br><br>

        <label>Street Address</label><br>
        <textarea name="address" rows="3" cols="30"></textarea>
        <br><br>

        <label>State</label><br>
        <select name="state">
            <option value="Queensland">Queensland</option>
            <option value="Victoria">Victoria</option>
            <option value="New South Wales">New South Wales</option>
            <option value="Tasmania">Tasmania</option>
            <option value="South Australia">South Australia</option>
            <option value="Western Australia">Western Australia</option>
        </select>
        <br><br>

        <input type="hidden" name="country" value="Australia">

        <label>Gender</label><br>
        <input type="radio" name="sex" value="Male" required> Male
        <input type="radio" name="sex" value="Female"> Female
        <br><br>

        <label>Vegetarian?</label>
        <input type="checkbox" name="vegetarian" value="Yes">
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </fieldset>

</form>

</body>
</html>
